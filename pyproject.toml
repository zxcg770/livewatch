[project]
name = "livewatch"
version = "0.1.0"
description = "AI 盯播工具：实时识别主播讲解内容并比对话术框架"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.27",
    "imageio-ffmpeg>=0.6.0",
    "numpy>=2.4.6",
    "pywebview>=6.2.1",
    "pyyaml>=6.0.3",
    "sherpa-onnx>=2.0.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
