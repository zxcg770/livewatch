# 美妆护肤带货话术框架（默认模板）
# 运营可按品牌 / 单品复制一份修改，在界面中选择使用。

name: 美妆护肤带货通用框架
product:
  brand: 韩束
  name: 第三代红蛮腰礼盒（水 + 乳 + 霜）
  selling_points:
    - 第三代升级款
    - 7 项国家专利（需有证明材料）
    - 买正装送正装、赠品丰富
    - 官方旗舰店、运费险、7 天无理由
  notes: 化妆品功效宣称须有依据，抗皱/紧致类表述避免"全部改善""根治"等绝对化用语。

# 本地表达指标阈值（不经过大模型，实时计算）
thresholds:
  rate_fast: 380       # 字/分钟（按讲话时长计），超过视为语速过快
  rate_slow: 160       # 低于视为语速过慢、拖沓
  silence_gap: 8       # 秒，连续无人讲话超过视为冷场
  talk_ratio_min: 0.5  # 窗口内讲话时长占比低于该值视为冷场多
  filler_per_100: 4    # 每百字口头禅次数超过视为口头禅多
  viewer_drop: 0.15    # 3 分钟内在线人数比最高点下跌超过该比例时告警

# 话术阶段：大模型判断最近 N 分钟是否覆盖、讲得是否到位
stages:
  - id: hook
    name: 开场留人
    must: 用福利 / 悬念 / 互动把新进来的观众留住
  - id: product
    name: 产品介绍
    must: 讲清品名、规格、组合内容、适用人群
  - id: selling_point
    name: 核心卖点
    must: 讲成分、功效、使用感受，并且表述合规、有依据
  - id: trust
    name: 信任背书
    must: 官方旗舰店、专利 / 检测报告、销量口碑等
  - id: price
    name: 价格与福利
    must: 给出原价锚点和到手价，讲清赠品、优惠券怎么领
  - id: urgency
    name: 促单逼单
    must: 限时、限量、倒计时，引导立即下单
  - id: after_sale
    name: 售后保障
    must: 运费险、7 天无理由、正品保障
  - id: interaction
    name: 互动
    must: 提问、引导扣字、点关注、加粉丝团

# 节奏要求：大模型在窗口内检查
rules:
  - 每 5 分钟内至少完整报一次价（原价 + 到手价）
  - 不能连续 3 分钟只逼单不讲产品
  - 提到功效时要说明依据（检测、专利、成分）

# ASR 纠错：品牌名、专有名词常被识别错，识别后直接替换
asr_corrections:
  韩数: 韩束
  浅店: 旗舰店
  无流: 无理由
  红满腰: 红蛮腰

# 追加的自定义违禁词（与内置词库合并）
extra_banned:
  - word: 郑总临时加的
    category: 虚构紧迫
    reason: 虚构高管临时加赠，可能构成虚假宣传
